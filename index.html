<style>
:root{
  --nuit:#06050b;--s1:#0f0d13;--s2:#17141c;--s3:#211d28;--line:#2a2531;
  --or:#d4a937;--or2:#f1d27a;--or3:#8a6a1f;--ivoire:#f3ecdd;--sable:#a9a08f;
  --ok:#52c48f;--bad:#e8675f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nuit);color:var(--ivoire);font-family:var(--sans);font-size:16px;line-height:1.4}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 50% at 50% -8%,rgba(212,169,55,.11),transparent 62%),var(--nuit);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* états de livraison */
.st-enregistre{--st:#8d8799}.st-pris_en_charge{--st:#6fa8e8}.st-en_transit{--st:#f1d27a}
.st-en_livraison{--st:#f0a24a}.st-livre{--st:#52c48f}.st-annule{--st:#e8675f}

/* boutons */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405;box-shadow:0 1px 0 rgba(255,255,255,.35) inset}
.btn:disabled{opacity:.6}
.btn.block{width:100%}
.line-btn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:14px;color:var(--ivoire)}
.txt{background:none;border:0;padding:6px 3px;font-size:13px;color:var(--or2)}
.txt.danger{color:var(--bad)}

/* champs */
label{display:block;font-size:13px;color:var(--sable);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(212,169,55,.16)}
textarea{min-height:84px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--or2) 50%),linear-gradient(135deg,var(--or2) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* connexion */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px;max-width:400px;margin:0 auto}
.logo-big{display:block;width:min(70vw,270px);height:auto;margin:0 auto 6px;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 97%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.auth h1{margin:0;text-align:center;font:600 24px var(--serif);color:var(--or2)}
.auth .sub{text-align:center;color:var(--sable);margin:4px 0 22px;font-size:15px}
.auth .btn{margin-top:20px}
.link{background:none;border:0;color:var(--or2);margin:18px auto 0;display:block;text-decoration:underline;text-underline-offset:3px;font-size:15px}
.invit{background:var(--s2);border:1px solid var(--or3);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ivoire);margin-bottom:6px}

/* en-tête */
header{position:sticky;top:0;z-index:5;background:rgba(6,5,11,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:38px;width:auto;display:block}
.brand b{font:600 19px var(--serif);color:var(--or2);display:block;line-height:1.1}
.brand small{color:var(--sable);font-size:12px}

/* titres */
h2.page{font:600 23px var(--serif);margin:16px 0 2px}
h3.sec{font:600 18px var(--serif);margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h3.sec small{font:400 14px var(--sans);color:var(--sable)}
.lead{color:var(--sable);margin:0 0 10px;font-size:14px}

/* accueil : le grand chiffre */
.hero{position:relative;overflow:hidden;padding:16px 4px 4px;margin-top:2px;min-height:150px}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:70px;pointer-events:none}
.hero .k{margin:0;color:var(--sable);font-size:15px}
.hero .n{margin:0;font:600 68px/1 var(--serif);letter-spacing:-.02em;background:linear-gradient(180deg,#f9e29a,#c4962b);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .s{margin:4px 0 52px;font-size:14px;color:var(--ivoire)}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:14px;background:var(--s2)}
.seg i{display:block;background:var(--st);min-width:6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:14px 0 0;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px;color:var(--sable)}
.legend li:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--st);flex:none}
.legend b{color:var(--ivoire);margin-left:auto;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:9px 4px;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts dt{color:var(--sable);font-size:13px}
.facts dd{margin:0;font:600 22px var(--serif);color:var(--ivoire)}

/* cartes */
.card{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--st,var(--line));border-radius:10px;padding:9px 11px 3px;margin-bottom:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ref{font:600 15px var(--serif);letter-spacing:.02em}
.badge{font-size:12px;color:var(--st);border:1px solid var(--st);border-radius:999px;padding:2px 9px;white-space:nowrap}
.who{margin:4px 0 0;font-weight:600;font-size:15px}
.who small{font-weight:400;color:var(--sable);margin-left:6px;font-size:12.5px}
.desc{margin:2px 0 0;color:#dcd5c5;font-size:14px}
.route{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-size:14px}
.route .dots{flex:1;border-top:2px dotted var(--or3);position:relative;min-width:24px;height:0}
.route .dots:after{content:"";position:absolute;right:0;top:-5px;width:8px;height:8px;border-right:2px solid var(--or);border-top:2px solid var(--or);transform:rotate(45deg)}
.meta{display:flex;flex-wrap:wrap;gap:0 14px;color:var(--sable);font-size:12.5px;margin-top:3px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin-top:6px;padding-top:4px;border-top:1px solid var(--line)}
.actions select{width:auto;padding:6px 28px 6px 10px;font-size:13px;border-radius:9px;background-color:var(--s2);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%}
.client-name{font:600 17px var(--serif)}
.code{display:inline-block;margin-top:4px;border:1px dashed var(--or3);border-radius:8px;padding:3px 12px;letter-spacing:.22em;font-weight:700;color:var(--or2);font-variant-numeric:tabular-nums}
.empty{color:var(--sable);text-align:center;padding:30px 12px;border:1px dashed var(--line);border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ivoire);padding:8px 14px;border-radius:999px;font-size:14px}
.chip.on{background:var(--or);color:#1a1405;border-color:var(--or);font-weight:600}
.person{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 8px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:7px 11px;margin-bottom:6px;font-size:14px}
.person>span:first-child{flex:1 1 190px;min-width:0;overflow-wrap:anywhere}
.person>span:last-child:not(:first-child){display:flex;gap:4px;flex:none}
.tag{font-size:12px;color:#1a1405;background:var(--or2);border-radius:999px;padding:2px 9px;margin-left:8px;white-space:nowrap}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline .btn{padding:12px 16px}

/* navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,9,14,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:flex;justify-content:space-around;height:62px;align-items:stretch}
nav button{position:relative;flex:1;background:none;border:0;color:var(--sable);font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--or2)}
nav button.on:before{content:"";position:absolute;top:0;width:30px;height:2px;border-radius:2px;background:var(--or)}
nav svg{width:22px;height:22px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;font-size:30px;line-height:1;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405;box-shadow:0 8px 22px rgba(0,0,0,.55)}

/* fenêtres */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font:600 22px var(--serif);color:var(--or2)}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns .btn,.sheet .btns .line-btn{flex:1}
.sheet .stack{flex-direction:column}
.note{color:var(--sable);font-size:13px;margin:10px 0 0}
.msg{white-space:pre-wrap;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin:12px 0 0;overflow-wrap:anywhere}
.tl{list-style:none;margin:16px 0 0;padding:0 0 0 16px;border-left:2px solid var(--or3)}
.tl li{position:relative;padding:0 0 16px 14px}
.tl li:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--or)}
.tl small{display:block;color:var(--sable)}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:50;background:var(--s3);border:1px solid var(--or);color:var(--ivoire);padding:10px 16px;border-radius:12px;max-width:90%;display:none;font-size:14px}
#toast.err{border-color:var(--bad)}
#toast button{margin-left:12px;border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:linear-gradient(135deg,#f6dc8e,#cfa032);color:#1a1405;font-size:14px}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sable)}
.mode.livreur{color:var(--or2)}.mode.livreur:before{background:var(--or2)}
.mode.retrait{color:#8fd0ff}.mode.retrait:before{background:#6fa8e8}
.mode.none{color:var(--sable)}
.thumbs{display:flex;flex-wrap:wrap;gap:0 8px}
.thumb{display:block;flex:0 0 88px;margin:6px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--s2);text-decoration:none}
.thumb img{display:block;width:100%;height:64px;object-fit:cover}
.thumb span{display:block;padding:2px 6px;font-size:11px;color:var(--sable)}
.preview{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;border:1px solid var(--line);margin-top:14px;background:var(--s2)}
body.plain{background:var(--nuit)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const sb = supabase.createClient(SB_URL, SB_KEY);
const STATUTS = [
  ['enregistre', 'Enregistré'], ['pris_en_charge', 'Pris en charge'], ['en_transit', 'En transit'],
  ['en_livraison', 'En livraison'], ['livre', 'Livré'], ['annule', 'Annulé']
];
const LABEL = Object.fromEntries(STATUTS);
const S = {
  user: null, admin: null, view: 'accueil', clients: [], livraisons: [], admins: [], invites: [],
  filtre: 'tous', q: '', authMode: location.hash === '#invitation' ? 'signup' : 'login'
};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR') : '';
const fmtDateTime = d => new Date(d).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
const fmtPrix = (p, d) => Number(p).toLocaleString('fr-FR') + ' ' + (d || 'FCFA');
const today = () => new Date().toLocaleDateString('en-CA');
const clientById = id => S.clients.find(c => c.id === id);
const officeUrl = () => location.href.split('#')[0];

let toastTimer;
function toast(msg, err, action) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label; b.dataset.a = action.a; b.dataset.id = action.id;
    t.appendChild(b);
  }
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, action ? 9000 : 3400);
}
function normTel(s) {
  let t = String(s || '').replace(/[\s\-.()]/g, '');
  if (t.startsWith('00')) t = '+' + t.slice(2);
  if (!t.startsWith('+') && /^\d{8}$/.test(t)) t = '+227' + t;
  return t;
}
function genCode() {
  const n = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
  return String(n).padStart(6, '0');
}

/* ---------- Données ---------- */
async function setUser(u) {
  const change = !u || !S.user || S.user.id !== u.id;
  S.user = u; S.admin = null;
  if (change) {
    // Nouvelle session : on repart d'un écran vierge, sans données de la personne précédente
    S.view = 'accueil'; S.q = ''; S.filtre = 'tous';
    S.clients = []; S.livraisons = []; S.admins = []; S.invites = [];
  }
  if (u) {
    const r = await sb.from('sahel_admins').select('user_id').eq('user_id', u.id).maybeSingle();
    S.admin = !!r.data;
    if (!S.admin) {
      // Quelqu'un a peut-être invité cette adresse e-mail : on réclame l'accès
      const c = await sb.rpc('sahel_reclamer_admin');
      if (c && c.data === true) S.admin = true;
    }
    if (S.admin) await loadAll();
  }
  render();
}
async function loadAll() {
  const [c, l] = await Promise.all([
    sb.from('sahel_clients').select('*').order('created_at', { ascending: false }),
    sb.from('sahel_livraisons').select('*').order('created_at', { ascending: false })
  ]);
  if (c.error || l.error) { toast((c.error || l.error).message, true); return; }
  S.clients = c.data; S.livraisons = l.data;
}
async function loadEquipe() {
  const [a, i] = await Promise.all([
    sb.rpc('sahel_liste_admins'),
    sb.from('sahel_invitations').select('*').order('created_at', { ascending: false })
  ]);
  if (a.error || i.error) { toast('Équipe indisponible : ' + (a.error || i.error).message, true); return; }
  S.admins = a.data || []; S.invites = i.data || [];
}

/* ---------- Vues ---------- */
function authView() {
  const signup = S.authMode === 'signup';
  const inv = location.hash === '#invitation';
  return `<div class="auth">
    <img class="logo-big" src="${LOGO}" alt="Sahel Market">
    <h1>Office logistique</h1>
    <p class="sub">${signup ? 'Crée ton compte administrateur' : 'Connecte-toi pour gérer les livraisons'}</p>
    ${signup ? '<div class="invit">Utilise l’adresse e-mail à laquelle on t’a envoyé l’invitation. Tu recevras un mail de confirmation.</div>' : ''}
    <form data-form="auth">
      <label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="pw">Mot de passe</label><input id="pw" name="password" type="password" minlength="8" autocomplete="${signup ? 'new-password' : 'current-password'}" required>
      <button class="btn block" type="submit">${signup ? 'Créer mon compte' : 'Se connecter'}</button>
    </form>
    ${inv ? `<button class="link" data-a="authmode">${signup ? 'J’ai déjà un compte' : 'Créer mon compte'}</button>` : ''}
  </div>`;
}
function denyView() {
  return `<div class="auth">
    <img class="logo-big" src="${LOGO}" alt="Sahel Market">
    <h1>Accès en attente</h1>
    <p class="sub">Le compte ${esc(S.user.email)} n’a pas encore accès à l’office. Demande à un administrateur de t’inviter avec cette adresse, puis revérifie.</p>
    <button class="btn block" data-a="recheck">Revérifier mon accès</button>
    <button class="link" data-a="logout">Se déconnecter</button>
  </div>`;

async function doAuth(f) {
  const btn = f.querySelector('button[type=submit]');
  const email = f.email.value.trim(), password = f.password.value;
  btn.disabled = true;
  try {
    if (S.authMode === 'signup') {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) return toast(error.message, true);
      if (data.session) return await setUser(data.session.user);
      toast('Compte créé. Ouvre le lien reçu par e-mail (vérifie les spams), puis connecte-toi.');
      S.authMode = 'login'; render();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return toast(error.code === 'email_not_confirmed' ? 'E-mail pas encore confirmé : ouvre le lien reçu par e-mail (vérifie les spams).' : 'E-mail ou mot de passe incorrect.', true);
      await setUser(data.user);
    }
  } finally { btn.disabled = false; }
}
async function saveClient(f) {
  const id = f.dataset.id;
  const row = { nom: f.nom.value.trim(), telephone: normTel(f.telephone.value), code: f.code.value.trim() };
  if (!row.nom) return toast('Le nom est obligatoire.', true);
  if (!/^\+?\d{8,15}$/.test(row.telephone)) return toast('Numéro de téléphone invalide.', true);
  if (row.code.length < 4) return toast('Le code doit avoir 4 caractères minimum.', true);
  const req = id ? sb.from('sahel_clients').update(row).eq('id', id).select().single()
                 : sb.from('sahel_clients').insert(row).select().single();
  const { data, error } = await req;
  if (error) return toast(error.code === '23505' ? 'Ce numéro existe déjà.' : error.message, true);
  if (id) S.clients = S.clients.map(c => c.id === id ? data : c); else S.clients.unshift(data);
  closeModal(); render(); toast(id ? 'Client modifié.' : 'Client créé.');
}
async function saveLiv(f) {
  const id = f.dataset.id;
  const row = {
    client_id: f.client_id.value, description: f.description.value.trim(),
    depart: f.depart.value.trim(), destination: f.destination.value.trim(),

  };

}

async function fichierPhoto(l) {
  const p = l.statut === 'livre' && l.preuve_path ? l.preuve_path : l.photo_path;
  if (!p || !navigator.share || !navigator.canShare) return null;
  try {
    const r = await fetch(PREUVES + p);
    if (!r.ok) return null;
    const f = new File([await r.blob()], 'colis-' + l.reference + '.jpg', { type: 'image/jpeg' });
    return navigator.canShare({ files: [f] }) ? f : null;
  } catch (e) { return null; }
}

  if (!l || !c) return toast('Client introuvable.', true);
  const f = await fichierPhoto(l);
  if (f) {
    try { await navigator.share({ files: [f], text: msgStatut(l, true) }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; /* sinon : message seul avec le lien */ }

/* ---------- Photo de preuve ---------- */
let photoFor = null;
async function compresser(file, max = 1000) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise((ok, ko) => cv.toBlob(b => b ? ok(b) : ko(new Error('compression')), 'image/jpeg', 0.72));
  } finally { URL.revokeObjectURL(url); }
}
async function supprimerPreuve(path) {
  if (path) { try { await sb.storage.from('sahel-preuves').remove([path]); } catch (e) { /* sans gravité */ } }
}
const COL = { colis: 'photo_path', preuve: 'preuve_path' };
async function envoyerPhoto(id, kind, file) {
  const col = COL[kind];
  const l = S.livraisons.find(x => x.id === id);
  if (!l || !file || !col) return;
  const ancien = l[col];
  const enModal = !!document.querySelector('#modal [data-mk="' + id + '"]');
  toast('Envoi de la photo…');
  let blob;
  try { blob = await compresser(file); } catch (e) { return toast('Image illisible, essaie une autre photo.', true); }
  const path = crypto.randomUUID() + '.jpg';
  const up = await sb.storage.from('sahel-preuves').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (up.error) return toast('Envoi impossible : ' + up.error.message, true);
  const { data, error } = await sb.from('sahel_livraisons').update({ [col]: path }).eq('id', id).select().single();
  if (error) { await supprimerPreuve(path); return toast(error.message, true); }
  await supprimerPreuve(ancien);
  S.livraisons = S.livraisons.map(x => x.id === id ? data : x);
  render(); if (enModal) showLivre(id);
  toast(kind === 'colis' ? 'Photo du colis enregistrée.' : 'Photo de preuve enregistrée.', false, { label: 'Prévenir le client', a: 'notify', id });
}
async function retirerPhoto(id, kind) {
  const col = COL[kind];
  const l = S.livraisons.find(x => x.id === id);
  if (!l || !col || !l[col] || !confirm('Retirer cette photo ?')) return;
  const ancien = l[col];
  const { data, error } = await sb.from('sahel_livraisons').update({ [col]: null }).eq('id', id).select().single();
  if (error) return toast(error.message, true);
  await supprimerPreuve(ancien);
  S.livraisons = S.livraisons.map(x => x.id === id ? data : x);
  const enModal = !!document.querySelector('#modal [data-mk="' + id + '"]');
  render(); if (enModal) showLivre(id);
  toast('Photo retirée.');
}
async function patchClient(id, patch, msg) {
  const { data, error } = await sb.from('sahel_clients').update(patch).eq('id', id).select().single();
  if (error) return toast(error.message, true);
  S.clients = S.clients.map(c => c.id === id ? data : c); render(); toast(msg);
}
async function sendInvite(f) {
  const email = f.email.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Adresse e-mail invalide.', true);
  if (S.admins.some(a => (a.email || '').toLowerCase() === email)) return toast('Cette personne est déjà administrateur.', true);
  const { error } = await sb.from('sahel_invitations').insert({ email, invite_par: S.user.id });
  if (error) return toast(error.code === '23505' ? 'Cette personne est déjà invitée.' : error.message, true);
  await loadEquipe(); render(); showInvite(email, true);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copié.'); } catch (e) { toast('Copie impossible, recopie le message à la main.', true); }
}
function msgClient(c) {
  return `Bonjour ${c.nom}, vous pouvez suivre vos livraisons Sahel AKD${CLIENT_URL ? ' sur ' + CLIENT_URL : ''}.\nNuméro : ${c.telephone}\nCode : ${c.code}`;
}

document.addEventListener('click', async e => {
  if (e.target.classList && e.target.classList.contains('backdrop')) { closeModal(); return; }
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a, id = t.dataset.id, email = t.dataset.email;
  const c = id ? clientById(id) : null;
  const l = id ? S.livraisons.find(x => x.id === id) : null;
  if (a === 'authmode') { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; render(); }
  else if (a === 'logout') {
    // On vide la session avant signOut : l'événement automatique de déconnexion ne déclenche alors rien de plus
    S.user = null;
    await sb.auth.signOut();
    await setUser(null);
  }
  else if (a === 'recheck') { await setUser(S.user); }
  else if (a === 'nav') {
    S.view = t.dataset.v; S.q = ''; S.filtre = 'tous';
    if (S.view === 'equipe') await loadEquipe();
    render(); window.scrollTo(0, 0);
  }
  else if (a === 'filtre') { S.filtre = t.dataset.v; render(); }
  else if (a === 'close') closeModal();
  else if (a === 'add-menu') openModal(`<h3>Ajouter</h3>
    <div class="btns stack"><button class="btn" data-a="add-client">Nouveau client</button><button class="btn" data-a="add-liv">Nouvelle livraison</button><button class="line-btn" data-a="close">Annuler</button></div>`);
  else if (a === 'add-client') clientForm(null);
  else if (a === 'add-liv') livForm(null);
  else if (a === 'edit-client' && c) clientForm(c);
  else if (a === 'edit-liv' && l) livForm(l);
  else if (a === 'hist') showHist(id);
  else if (a === 'notify') { $('#toast').style.display = 'none'; await notifyClient(id); }
  else if (a === 'photo' && l) { photoFor = { id, kind: t.dataset.kind === 'colis' ? 'colis' : 'preuve' }; const inp = $('#photo-input'); inp.value = ''; inp.click(); }
  else if (a === 'photo-del') retirerPhoto(id, t.dataset.kind === 'colis' ? 'colis' : 'preuve');
  else if (a === 'copy' && c) copyText(msgClient(c));
  else if (a === 'wa' && c) window.open('https://wa.me/' + c.telephone.replace(/\D/g, '') + '?text=' + encodeURIComponent(msgClient(c)), '_blank');
  else if (a === 'regen' && c) { if (confirm('Générer un nouveau code pour ' + c.nom + ' ? L’ancien ne marchera plus.')) patchClient(id, { code: genCode(), tentatives: 0, bloque_jusqu_a: null }, 'Nouveau code généré.'); }
  else if (a === 'unlock' && c) patchClient(id, { tentatives: 0, bloque_jusqu_a: null }, 'Client débloqué.');
  else if (a === 'del-client' && c) {
    if (!confirm('Supprimer ' + c.nom + ' et toutes ses livraisons ?')) return;
    const preuves = S.livraisons.filter(x => x.client_id === id).flatMap(x => [x.photo_path, x.preuve_path]).filter(Boolean);
    const { error } = await sb.from('sahel_clients').delete().eq('id', id);
    if (error) return toast(error.message, true);
    if (preuves.length) { try { await sb.storage.from('sahel-preuves').remove(preuves); } catch (e) { /* sans gravité */ } }
    S.clients = S.clients.filter(x => x.id !== id); S.livraisons = S.livraisons.filter(x => x.client_id !== id);
    render(); toast('Client supprimé.');
  }
  else if (a === 'del-liv' && l) {
    if (!confirm('Supprimer la livraison #' + l.reference + ' ?')) return;
    const { error } = await sb.from('sahel_livraisons').delete().eq('id', id);
    if (error) return toast(error.message, true);
    await supprimerPreuve(l.preuve_path); await supprimerPreuve(l.photo_path);
    S.livraisons = S.livraisons.filter(x => x.id !== id); render(); toast('Livraison supprimée.');
  }
  else if (a === 'del-admin') {
    const who = S.admins.find(x => x.user_id === id);
    if (!who || !confirm('Retirer l’accès administrateur à ' + who.email + ' ?')) return;
    const { error } = await sb.rpc('sahel_retirer_admin', { p_user: id });
    if (error) return toast(error.message, true);
    await loadEquipe(); render(); toast('Accès retiré.');
  }
  else if (a === 'del-invite') {
    const { error } = await sb.from('sahel_invitations').delete().eq('email', email);
    if (error) return toast(error.message, true);
    await loadEquipe(); render(); toast('Invitation annulée.');
  }
  else if (a === 'share-invite') showInvite(email, false);
  else if (a === 'copy-invite') copyText(inviteMessage(email));
  else if (a === 'wa-invite') window.open('https://wa.me/?text=' + encodeURIComponent(inviteMessage(email)), '_blank');
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, k = f.dataset.form;
  if (k === 'auth') doAuth(f); else if (k === 'client') saveClient(f); else if (k === 'liv') saveLiv(f); else if (k === 'invite') sendInvite(f);
});
document.addEventListener('change', e => {
  if (e.target.id === 'photo-input') { const f = e.target.files && e.target.files[0]; if (f && photoFor) envoyerPhoto(photoFor.id, photoFor.kind, f); return; }
  const id = e.target.dataset && e.target.dataset.statut;
  if (id) changeStatut(id, e.target.value);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  $('#liste').innerHTML = S.view === 'clients' ? listClients() : listLiv();
});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('sahel-office-sw.js').catch(() => {}); } catch (e) { /* sans gravité */ } });
}
(async function init() {
  const { data } = await sb.auth.getSession();
  await setUser(data.session ? data.session.user : null);
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.user) setTimeout(() => setUser(null), 0); });
})();
</script>
